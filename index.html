<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây Gia Phả - Dòng Họ Nguyễn Sĩên</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
            font-size: 1.3rem;
        }
        #mynetwork {
            width: 100%;
            height: calc(100vh - 50px);
            background-color: #ffffff;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            color: #666;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cây Gia Phả - Dòng Họ Nguyễn Sĩên</h1>
    </header>

    <div id="loading" class="loading">Đang tải dữ liệu gia phả...</div>
    <div id="mynetwork"></div>

    <script>
        async function loadFamilyTree() {
            try {
                const response = await fetch('family_desktop.json');
                if (!response.ok) throw new Error('Không tìm thấy file family_desktop.json');
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                let nodesArray = [];
                let edgesArray = [];
                let members = Array.isArray(data) ? data : (data.persons || data.members || Object.values(data));

                members.forEach(p => {
                    let genderColor = (p.gender === "Nữ" || p.gender === "female") ? "#ffb6c1" : "#87cefa";
                    nodesArray.push({
                        id: p.id,
                        label: `${p.name || 'Chưa rõ'}\n(Đời ${p.generation || 1})`,
                        color: genderColor,
                        shape: 'box',
                        margin: 10
                    });

                    if (p.father_id) edgesArray.push({ from: p.father_id, to: p.id, arrows: 'to' });
                    if (p.mother_id) edgesArray.push({ from: p.mother_id, to: p.id, arrows: 'to' });
                });

                const container = document.getElementById('mynetwork');
                const networkData = {
                    nodes: new vis.DataSet(nodesArray),
                    edges: new vis.DataSet(edgesArray)
                };
                const options = {
                    layout: {
                        hierarchical: {
                            enabled: true,
                            direction: 'UD',
                            sortMethod: 'hubsize'
                        }
                    },
                    physics: false
                };

                new vis.Network(container, networkData, options);

            } catch (error) {
                document.getElementById('loading.innerHTML = `<span style="color: red;">Lỗi tải dữ liệu: ${error.message}</span>`;
            }
        }
        loadFamilyTree();
    </script>
</body>
</html>
